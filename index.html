<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Operation Peekaboo Hunt!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #B0E8A7;
            color: #2d3748;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .progress {
            font-size: 0.9em;
            color: #718096;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .clue-box {
            background-color: #f7fafc;
            padding: 18px;
            border-left: 5px solid #764ba2;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 1.1em;
            line-height: 1.4;
        }
        input[type="text"] {
            width: 80%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1em;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #764ba2;
        }
        button {
            padding: 12px 24px;
            background-color: #ff6b6b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
        }
        button:hover {
            background-color: #ee5253;
        }
        .feedback {
            margin-top: 15px;
            font-weight: bold;
            min-height: 24px;
        }
        .correct { color: #10b981; }
        .incorrect { color: #ef4444; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="card" id="game-card">
        <div class="progress" id="progress-text">Question 1 of 28</div>
        <div class="clue-box" id="clue-text">Loading question...</div>
        
        <input type="text" id="answer-input" placeholder="Type your answer here..." autocomplete="off">
        <br>
        <button onclick="checkAnswer()">Submit</button>
        
        <div class="feedback" id="feedback-text"></div>
    </div>

    <div class="card hidden" id="victory-card">
        <h2>yolo we ball</h2>
        <p>if you made it this far, congrats! enter the word "fuck you" and your fav chara into the note section for your freebie! Its worth it I promise LOLL</p>
        <button onclick="restartGame()">Play Again</button>
    </div>

    <script>
        // 25 Questions and accepted answers
        const huntData = [
            { question: "1. Who is the discord pfp?", answer: "haru" },
            { question: "2. What was the home country of the princess and ex 2 prince?", answer: "lapona" },
            { question: "3. Who was the anomaly that recently plage JP tkdb's media? ", answer: "Takeru" },
            { question: "4. Whose the one who likes to drive?", answer: "Jo Kongoza" },
            { question: "5. who was in room 304", answer: "alan mido" },
            { question: "6. What is Jin's favorite subject?", answer: "Anomalous Information Studies" },
            { question: "7. Did Romeo have a sister?", answer: "yes" },
            { question: "8. What way is Elias' right eye pupli is pointing?", answer: "up" },
            { question: "9. What is the episode name of the scene where ren drop the ipad on his face? Note: Don't use number", answer: "Our Last Goodbye Act I" },
            { question: "10. What flower is Subaru's earring?", answer: "wisteria" },
            { question: "11. What is Zenji's little doll name?", answer: "saburo" },
            { question: "12. Whose the Mc's curse twin?", answer: "rui Mizuki" },
            { question: "13. What artifact dose jiro usec", answer: "chainsaw" },
            { question: "14. What house did Tohma og belong to?", answer: "vagastrom" },
            { question: "15. Who did Leo attend middle school with?", answer: "Shohei Haizono" },
            { question: "16. What restaurant did Haku wanted to open if he could leave? Note: Two worded answer, second word is restaurant ", answer: "ramen restaurant" },
            { question: "17. Who did Subaru visit across the hotarubi's lake?", answer: "Lyca Colt" },
            { question: "18. What does Towa call elias? ", answer: "sundew" },
            { question: "19. What blood type is Taiga?", answer: "O" },
            { question: "20. What star sign is Kaito?", answer: "sagittarius" },
            { question: "21. What pocket does Ritsu keep his recorder?", answer: "left" },
            { question: "22. Did Lucas flipped/body slam Kaito into the ground in the first episode? ", answer: "yes" },
            { question: "23. What fae type is Edward?", answer: "vampire" },
            { question: "24. How many dots dose Shion have under his eye?", answer: "3" },
            { question: "25. What is the name of Sho's artifact?", answer: "Bonnie" },
            { question: "26. how many weapon does taiga have?", answer: "2" },
            { question: "27. Who built majority of the gambling machine in sinostra?", answer: "Mio Susuhara" },
            { question: "28. who listen to classical music?", answer: "yuri isami" },
        ];

        let currentStep = 0;

        function updateCard() {
            document.getElementById("progress-text").textContent = `Question ${currentStep + 1} of ${huntData.length}`;
            // Fixed property name from .clue to .question
            document.getElementById("clue-text").textContent = huntData[currentStep].question;
            document.getElementById("answer-input").value = "";
            document.getElementById("feedback-text").textContent = "";
        }

        function checkAnswer() {
            const inputField = document.getElementById("answer-input");
            const feedback = document.getElementById("feedback-text");
            const userAnswer = inputField.value.trim().toLowerCase();
            const correctAnswer = huntData[currentStep].answer.toLowerCase();

            if (userAnswer.includes(correctAnswer) && userAnswer !== "") {
                feedback.className = "feedback correct";
                feedback.textContent = "Correct! Moving to the next question...";
                
                setTimeout(() => {
                    currentStep++;
                    if (currentStep < huntData.length) {
                        updateCard();
                    } else {
                        showVictory();
                    }
                }, 1000);
            } else {
                feedback.className = "feedback incorrect";
                feedback.textContent = "Try again!";
            }
        }

        function showVictory() {
            document.getElementById("game-card").classList.add("hidden");
            document.getElementById("victory-card").classList.remove("hidden");
        }

        function restartGame() {
            currentStep = 0;
            document.getElementById("game-card").classList.remove("hidden");
            document.getElementById("victory-card").classList.add("hidden");
            updateCard();
        }

        document.getElementById("answer-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkAnswer();
            }
        });

        updateCard();
    </script>

</body>
</html>
