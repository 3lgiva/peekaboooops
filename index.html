<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Operation Peekaboo Hunt!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #2d3748;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .progress {
            font-size: 0.9em;
            color: #718096;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .clue-box {
            background-color: #f7fafc;
            padding: 18px;
            border-left: 5px solid #764ba2;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 1.1em;
            line-height: 1.4;
        }
        input[type="text"] {
            width: 80%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1em;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #764ba2;
        }
        button {
            padding: 12px 24px;
            background-color: #ff6b6b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
        }
        button:hover {
            background-color: #ee5253;
        }
        .feedback {
            margin-top: 15px;
            font-weight: bold;
            min-height: 24px;
        }
        .correct { color: #10b981; }
        .incorrect { color: #ef4444; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="card" id="game-card">
        <div class="progress" id="progress-text">Question 1 of 25</div>
        <div class="clue-box" id="clue-text">Loading question...</div>
        
        <input type="text" id="answer-input" placeholder="Type your answer here..." autocomplete="off">
        <br>
        <button onclick="checkAnswer()">Submit</button>
        
        <div class="feedback" id="feedback-text"></div>
    </div>

    <div class="card hidden" id="victory-card">
        <h2>🎉 Ultimate Champion!</h2>
        <p>You successfully answered all 25 questions!</p>
        <button onclick="restartGame()">Play Again</button>
    </div>

    <script>
        // 25 Questions and accepted answers
        const huntData = [
            { clue: "1. What is the capital city of France?", answer: "paris" },
            { clue: "2. What planet is known as the Red Planet?", answer: "mars" },
            { clue: "3. How many sides does a hexagon have?", answer: "6" },
            { clue: "4. What gas do plants absorb from the atmosphere for photosynthesis?", answer: "carbon dioxide" },
            { clue: "5. What is the largest ocean on Earth?", answer: "pacific" },
            { clue: "6. Who painted the Mona Lisa?", answer: "da vinci" },
            { clue: "7. What chemical element has the symbol 'O'?", answer: "oxygen" },
            { clue: "8. What is the hardest natural substance on Earth?", answer: "diamond" },
            { clue: "9. Which primary color combined with blue makes green?", answer: "yellow" },
            { clue: "10. In what continent is the Sahara Desert located?", answer: "africa" },
            { clue: "11. What is the tallest mammal in the world?", answer: "giraffe" },
            { clue: "12. What instrument is used to measure temperature?", answer: "thermometer" },
            { clue: "13. What is the capital of Japan?", answer: "tokyo" },
            { clue: "14. How many bones are in the adult human body?", answer: "206" },
            { clue: "15. Which planet is closest to the Sun?", answer: "mercury" },
            { clue: "16. What metal is liquid at room temperature?", answer: "mercury" },
            { clue: "17. What is the largest organ in the human body?", answer: "skin" },
            { clue: "18. Who wrote the play 'Romeo and Juliet'?", answer: "shakespeare" },
            { clue: "19. What is the chemical symbol for Gold?", answer: "au" },
            { clue: "20. What force keeps us grounded on Earth?", answer: "gravity" },
            { clue: "21. How many continents are on Earth?", answer: "7" },
            { clue: "22. What animal is known as the King of the Jungle?", answer: "lion" },
            { clue: "23. What is the freezing point of water in degrees Celsius?", answer: "0" },
            { clue: "24. What primary language is spoken in Brazil?", answer: "portuguese" },
            { clue: "25. Which instrument has black and white keys and pedals?", answer: "piano" }
        ];

        let currentStep = 0;

        function updateCard() {
            document.getElementById("progress-text").textContent = `Question ${currentStep + 1} of ${huntData.length}`;
            document.getElementById("clue-text").textContent = huntData[currentStep].clue;
            document.getElementById("answer-input").value = "";
            document.getElementById("feedback-text").textContent = "";
        }

        function checkAnswer() {
            const inputField = document.getElementById("answer-input");
            const feedback = document.getElementById("feedback-text");
            const userAnswer = inputField.value.trim().toLowerCase();
            const correctAnswer = huntData[currentStep].answer.toLowerCase();

            if (userAnswer.includes(correctAnswer) && userAnswer !== "") {
                feedback.className = "feedback correct";
                feedback.textContent = "Correct! Moving to the next question...";
                
                setTimeout(() => {
                    currentStep++;
                    if (currentStep < huntData.length) {
                        updateCard();
                    } else {
                        showVictory();
                    }
                }, 1000);
            } else {
                feedback.className = "feedback incorrect";
                feedback.textContent = "Try again!";
            }
        }

        function showVictory() {
            document.getElementById("game-card").classList.add("hidden");
            document.getElementById("victory-card").classList.remove("hidden");
        }

        function restartGame() {
            currentStep = 0;
            document.getElementById("game-card").classList.remove("hidden");
            document.getElementById("victory-card").classList.add("hidden");
            updateCard();
        }

        document.getElementById("answer-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkAnswer();
            }
        });

        updateCard();
    </script>

</body>
</html>
