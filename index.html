<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Scavenger Hunt</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        .progress {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .clue-box {
            background-color: #eef2f5;
            padding: 15px;
            border-left: 5px solid #007bff;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 1.1em;
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1em;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
        }
        button:hover {
            background-color: #0056b3;
        }
        .feedback {
            margin-top: 15px;
            font-weight: bold;
        }
        .correct { color: #28a745; }
        .incorrect { color: #dc3545; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="card" id="game-card">
        <div class="progress" id="progress-text">Clue 1 of 3</div>
        <div class="clue-box" id="clue-text">
            I have hands, but I cannot clap. What am I?
        </div>
        
        <input type="text" id="answer-input" placeholder="Type your answer here..." autocomplete="off">
        <br>
        <button onclick="checkAnswer()">Submit</button>
        
        <div class="feedback" id="feedback-text"></div>
    </div>

    <div class="card hidden" id="victory-card">
        <h2>🎉 Congratulations!</h2>
        <p>You solved all the clues and completed the scavenger hunt!</p>
        <button onclick="restartGame()">Play Again</button>
    </div>

    <script>
        // Define your clues and answers here
        const huntData = [
            { clue: "I have hands, but I cannot clap. What am I?", answer: "clock" },
            { clue: "The more of me you take, the more you leave behind. What am I?", answer: "footsteps" },
            { clue: "I have a neck, but no head. What am I?", answer: "bottle" }
        ];

        let currentStep = 0;

        function checkAnswer() {
            const inputField = document.getElementById("answer-input");
            const feedback = document.getElementById("feedback-text");
            const userAnswer = inputField.value.trim().toLowerCase();
            const correctAnswer = huntData[currentStep].answer.toLowerCase();

            if (userAnswer === correctAnswer) {
                feedback.className = "feedback correct";
                feedback.textContent = "Correct! Moving to the next clue...";
                
                setTimeout(() => {
                    currentStep++;
                    if (currentStep < huntData.length) {
                        updateCard();
                    } else {
                        showVictory();
                    }
                }, 1200);
            } else {
                feedback.className = "feedback incorrect";
                feedback.textContent = "Try again!";
            }
        }

        function updateCard() {
            document.getElementById("progress-text").textContent = `Clue ${currentStep + 1} of ${huntData.length}`;
            document.getElementById("clue-text").textContent = huntData[currentStep].clue;
            document.getElementById("answer-input").value = "";
            document.getElementById("feedback-text").textContent = "";
        }

        function showVictory() {
            document.getElementById("game-card").classList.add("hidden");
            document.getElementById("victory-card").classList.remove("hidden");
        }

        function restartGame() {
            currentStep = 0;
            document.getElementById("game-card").classList.remove("hidden");
            document.getElementById("victory-card").classList.add("hidden");
            updateCard();
        }

        // Allow pressing "Enter" key to submit
        document.getElementById("answer-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkAnswer();
            }
        });
    </script>

</body>
</html>
